<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法物品卡 · D&D 2024 城主指南</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-title">魔法物品卡</span>
      <span class="brand-sub">D&amp;D 2024 · 城主指南</span>
    </div>
    <div class="summary" id="summary" aria-live="polite">
      <span class="summary-hint">在左侧勾选物品，或添加空白卡自填，右侧实时排版预览</span>
    </div>
    <div class="actions">
      <input type="file" id="importFile" accept=".md,.markdown,.json,.txt" hidden>
      <button type="button" id="importBtn" class="btn btn-ghost" title="从文件导入已选物品与排序">📥 导入</button>
      <button type="button" id="exportBtn" class="btn btn-ghost" title="导出已选物品为可分享文件">📤 导出</button>
      <button type="button" id="clearBtn" class="btn btn-ghost" title="清空所有已选">清空</button>
      <button type="button" id="printBtn" class="btn btn-primary" title="打印或保存为 PDF">🖨 打印为 PDF</button>
    </div>
  </header>

  <main class="layout">
    <section class="picker" aria-label="物品选择">
      <div class="filters">
        <div class="search-row">
          <input type="search" id="search" class="search" placeholder="搜索物品名（中文 / English / 拼音，支持错字模糊）…" autocomplete="off">
        </div>
        <div class="filter-row">
          <label class="sel"><span>类别</span><select id="catFilter"></select></label>
          <label class="sel"><span>稀有度</span><select id="rarityFilter"></select></label>
        </div>
        <div class="filter-row toggles">
          <label class="toggle"><input type="checkbox" id="attFilter"> <span>仅需同调</span></label>
          <label class="toggle"><input type="checkbox" id="onlySelected"> <span>仅显示已选</span></label>
          <span class="list-count" id="listCount">0 / 0</span>
        </div>

        <!-- 自定义 / 空白卡 -->
        <div class="custom-box">
          <div class="custom-head" id="customHead">
            <span>✎ 自定义 / 空白卡</span>
            <button type="button" id="customToggle" class="link-btn">展开 ▾</button>
          </div>
          <div class="custom-form hidden" id="customForm">
            <input type="text" id="cName" placeholder="物品名称（中文）" maxlength="40">
            <input type="text" id="cNameEn" placeholder="English (可选)" maxlength="60">
            <div class="c-row">
              <input type="text" id="cType" placeholder="类型，如 武器/护甲/奇物" maxlength="20">
              <input type="text" id="cDetail" placeholder="细节，如 长剑" maxlength="40">
            </div>
            <div class="c-row">
              <select id="cRarity"></select>
              <label class="toggle"><input type="checkbox" id="cAtt"> 需同调</label>
              <label class="toggle"><input type="checkbox" id="cCons"> 消耗品</label>
            </div>
            <div class="c-row">
              <label class="toggle" style="font-size:11px">充能数 <input type="number" id="cCharges" min="0" max="50" value="0" style="width:50px;padding:4px 6px;font-size:12px;border:1px solid var(--line-strong);border-radius:6px;background:#fffdf5;color:var(--ink)"></label>
              <span style="font-size:10px;color:var(--ink-soft)">（>0 时卡片右下角放对应数量空心圆圈）</span>
            </div>
            <textarea id="cDesc" placeholder="描述（可多行）" rows="3"></textarea>
            <div class="c-actions">
              <button type="button" id="cAddBtn" class="btn btn-primary btn-sm">＋ 添加为卡片</button>
              <button type="button" id="cUpdateBtn" class="btn btn-primary btn-sm hidden">保存修改</button>
              <button type="button" id="cCancelBtn" class="btn btn-ghost btn-sm hidden">取消</button>
              <button type="button" id="cBlankBtn" class="btn btn-ghost btn-sm" title="添加一张全空白卡，之后再点编辑填写">＋ 空白卡</button>
            </div>
          </div>
        </div>
      </div>

      <div class="spell-list" id="itemList"></div>
    </section>

    <section class="preview" aria-label="打印预览">
      <div class="preview-toolbar">
        <div class="tb-left">
          <div class="page-info">已选 <b id="selCount">0</b> 个 · 共 <b id="pageCount">0</b> 页（每页最多 6 张：3 行 × 2 列；过长物品自动占 2 行 1 列）</div>
          <button type="button" id="sortBtn" class="btn btn-sort" title="按稀有度排序已选物品">⇅ 一键排序</button>
        </div>
        <div class="preview-tools">
          <label class="paper-size"><span>纸张</span><select id="pageSize"><option value="A4">A4</option><option value="Letter">Letter</option></select></label>
          <button type="button" id="fontDown" class="btn btn-ghost btn-sm" title="缩小卡片字号">A⁻</button>
          <span id="fontLabel" class="zoom-label" title="卡片字号">100%</span>
          <button type="button" id="fontUp" class="btn btn-ghost btn-sm" title="放大卡片字号">A⁺</button>
          <button type="button" id="zoomOut" class="btn btn-ghost btn-sm">−</button>
          <span id="zoomLabel" class="zoom-label">100%</span>
          <button type="button" id="zoomIn" class="btn btn-ghost btn-sm">＋</button>
        </div>
      </div>
      <div class="preview-scroll" id="previewScroll">
        <div class="pages" id="pages">
          <div class="empty-state" id="emptyState">
            <div class="empty-illus">📜</div>
            <p>尚未选择任何物品。</p>
            <p class="muted">在左侧勾选物品，或添加空白卡自填，即可在此处排版为可打印的卡片。</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<script type="module">
  // 在线时从 CDN 加载拼音库，用于声音近似搜索（与法术书同款）。
  // 加载失败则退化到字符级模糊，并派发事件提示用户。
  (async () => {
    try {
      const mod = await import("https://cdn.jsdelivr.net/npm/pinyin-pro@3/+esm");
      const p = mod.pinyin || (mod.default && mod.default.pinyin) || mod.default;
      if (typeof p === "function") { window.__pinyin = p; window.dispatchEvent(new Event("pinyin-ready")); }
      else throw new Error("bad module");
    } catch (e) { window.dispatchEvent(new Event("pinyin-failed")); }
  })();
</script>
<script src="data/items.js"></script>
<script src="js/app.js"></script>
</body>
</html>
